name: Refresh TLE snapshots

# Fetches satellite element sets from Celestrak a few times a day and publishes them to a dedicated
# `data` branch, which is FORCE-PUSHED as a single squashed commit every run. That branch is served
# to the app through jsDelivr's CDN (see TLE_SNAP_BASE in index.html), so:
#   Celestrak sees ~4 requests/day total instead of N users x every page load.
#   The full Starlink constellation (~1.5 MB) can ship without bloating repo history or GitHub
#   Pages bandwidth - the branch never accumulates history, and jsDelivr absorbs the traffic.

on:
  schedule:
    - cron: '17 */6 * * *'      # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write                # needed to force-push the data branch

concurrency:
  group: refresh-tle
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch element sets from Celestrak
        run: |
          set -u
          mkdir -p out/tle
          UA="SkyWatch-TLE-Bot (+https://github.com/${{ github.repository }})"
          dl() { curl -sSfL --retry 3 --retry-delay 5 --max-time 90 -A "$UA" "$1"; }

          # group id -> Celestrak query. ids must match the GROUPS ids in index.html.
          declare -A Q=(
            [iss]="CATNR=25544"
            [stations]="GROUP=stations"
            [visual]="GROUP=visual"
            [gps-ops]="GROUP=gps-ops"
            [galileo]="GROUP=galileo"
            [oneweb]="GROUP=oneweb"
            [amateur]="GROUP=amateur"
            [geo]="GROUP=geo"
            [weather]="GROUP=weather"
            [starlink]="GROUP=starlink"       # FULL constellation now - no cap
            [launch30]="GROUP=last-30-days"    # recent launches (fresh Starlink trains)
          )

          for id in "${!Q[@]}"; do
            echo "- $id"
            if dl "https://celestrak.org/NORAD/elements/gp.php?${Q[$id]}&FORMAT=tle" > "out/tle/$id.txt.new"; then
              mv "out/tle/$id.txt.new" "out/tle/$id.txt"
            else
              echo "  fetch failed for $id - skipping (will keep last good copy on the branch if any)"
              rm -f "out/tle/$id.txt.new"
            fi
            sleep 3
          done

          # Safety net: never publish an empty file or an HTML error page.
          for f in out/tle/*.txt; do
            [ -f "$f" ] || continue
            if [ ! -s "$f" ] || head -c1 "$f" | grep -q '<'; then echo "bad payload $f - dropping"; rm -f "$f"; fi
          done

          test -n "$(ls -A out/tle 2>/dev/null)" || { echo "no snapshots fetched - aborting"; exit 1; }

      - name: Publish to the data branch (squashed, force-pushed)
        run: |
          set -e
          cd out
          git init -q
          git config user.name  "tle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tle
          git commit -q -m "TLE snapshots $(date -u +%FT%TZ)"
          git branch -M data
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          echo "Pushed $(ls tle | wc -l) files to the data branch."

      - name: Purge jsDelivr cache so the CDN serves the new snapshots promptly
        run: |
          cd out
          for f in tle/*.txt; do
            curl -sf "https://purge.jsdelivr.net/gh/${{ github.repository }}@data/$f" > /dev/null || true
          done
          echo "Requested jsDelivr purge for the refreshed files."
